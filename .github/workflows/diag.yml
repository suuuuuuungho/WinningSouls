name: Diagnose download issue

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Decode Yonsei ID
        run: echo "YONSEI_ID_DECODED=$(echo '${{ secrets.YONSEI_ID_B64 }}' | base64 -d)" >> "$GITHUB_ENV"
      - run: python diag_download.py
        env:
          ID: ${{ env.YONSEI_ID_DECODED }}
          PW: ${{ secrets.YONSEI_PW }}
